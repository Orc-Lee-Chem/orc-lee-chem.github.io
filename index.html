<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Mathematics manuscripts by Cheng Li, School of Mathematical Sciences, Fudan University.">
<title>Cheng Li — Mathematics</title>
<style>
  :root { color-scheme: light; --ink: #182423; --muted: #516060; --accent: #12554d; --rule: #cbd5d0; --paper: #faf9f5; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 1rem/1.6 system-ui, sans-serif; }
  main { width: min(100% - 3rem, 50rem); margin: 0 auto; padding: clamp(3rem, 10vw, 7rem) 0 4rem; }
  header { padding-bottom: 2.2rem; border-bottom: 1px solid var(--rule); }
  h1, h2, h3 { font-family: Georgia, serif; font-weight: 400; line-height: 1.18; margin: 0; }
  h1 { font-size: clamp(2.9rem, 8vw, 5.4rem); letter-spacing: -.07em; }
  header p { color: var(--muted); margin: .9rem 0 0; }
  h2 { font-size: 2rem; margin: 2.35rem 0 .6rem; }
  .papers { padding: 0; margin: 0; list-style: none; }
  .papers li { padding: 1.55rem 0; border-bottom: 1px solid var(--rule); }
  h3 { font-size: clamp(1.3rem, 4vw, 1.67rem); }
  .byline { margin: .55rem 0 .65rem; color: var(--muted); }
  .links { display: flex; flex-wrap: wrap; gap: .15rem 1.2rem; margin: 0; }
  a { color: var(--accent); text-underline-offset: .18em; }
  a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  @media (max-width: 28rem) { main { width: calc(100% - 2rem); } }
</style>
</head>
<body>
<main>
  <header>
    <h1>Cheng Li</h1>
    <p>School of Mathematical Sciences, Fudan University</p>
  </header>
  <section aria-labelledby="papers">
    <h2 id="papers">Papers</h2>
    <ul class="papers">
      <li>
        <h3>Short Integer Relations and Near-Covering Structure in the Lonely Runner Problem</h3>
        <p class="byline">Cheng Li · Manuscript</p>
        <p class="links">
          <a href="https://raw.githubusercontent.com/Orc-Lee-Chem/LonelyRunner/main/paper/lonely_runner_en.pdf">PDF</a>
          <a href="https://github.com/Orc-Lee-Chem/LonelyRunner">Repository</a>
        </p>
      </li>
    </ul>
  </section>
</main>
</body>
</html>
